<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Трекер трат</title>
<meta name="description" content="Личный трекер расходов: подписки, переводы, долги, курс валют и импорт из Monobank. Все данные хранятся только на вашем устройстве.">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Траты">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css?v=55">
</head>
<body>

<div class="statusbar-shim"></div>

<main id="screen"></main>

<button id="fab" class="fab" hidden aria-label="Добавить">+</button>

<nav class="tabbar">
  <button data-nav="home"><span class="tab-icon">📊</span>Главная</button>
  <button data-nav="ops"><span class="tab-icon">🧾</span>Операции</button>
  <button data-nav="subs"><span class="tab-icon">🔁</span>Платежи</button>
  <button data-nav="debts"><span class="tab-icon">🤝</span>Долги</button>
  <button data-nav="settings"><span class="tab-icon">⚙️</span>Ещё</button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
window.onerror = function(msg, url, lineNo) {
  var el = document.getElementById('screen');
  if (el && !el.innerHTML.trim()) {
    el.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#fff;">' +
      '<h2 style="margin-bottom:12px;font-size:22px">Обновление трекера</h2>' +
      '<p style="color:#8e9aa8;margin-bottom:24px;font-size:15px;line-height:1.4">Кэш приложения обновляется до новой версии.<br>Нажмите кнопку ниже:</p>' +
      '<button onclick="if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){for(var i=0;i<r.length;i++)r[i].unregister();location.reload(true);});}else{location.reload(true);}" style="background:#4da3ff;color:#fff;border:none;padding:14px 28px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(77,163,255,0.4)">🔄 Обновить приложение</button>' +
      '</div>';
  }
};
</script>
<script src="js/store.js?v=55"></script>
<script src="js/api.js?v=55"></script>
<script src="js/sync.js?v=55"></script>
<script src="js/qr.js?v=55"></script>
<script src="js/receipts.js?v=55"></script>
<script src="js/ai.js?v=55"></script>
<script src="js/app.js?v=55"></script>
</body>
</html>
